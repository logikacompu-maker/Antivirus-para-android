
{"name":"Construir APK Diego Gony Antivirus","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Crear proyecto","run":"mkdir -p DiegoGonyAntivirus/app\ncat > DiegoGonyAntivirus/app/build.gradle.kts <<'__END_FILE__'\nplugins {\n    id(\"com.android.application\")\n    id(\"org.jetbrains.kotlin.android\")\n}\nandroid {\n    namespace = \"com.diegogony.antivirus\"\n    compileSdk = 34\n    defaultConfig {\n        applicationId = \"com.diegogony.antivirus\"\n        minSdk = 23\n        targetSdk = 34\n        versionCode = 1\n        versionName = \"1.0\"\n    }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = \"17\" }\n}\n__END_FILE__\nmkdir -p DiegoGonyAntivirus/app/src/main\ncat > DiegoGonyAntivirus/app/src/main/AndroidManifest.xml <<'__END_FILE__'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <application\n        android:allowBackup=\"false\"\n        android:label=\"Diego Goñy Antivirus\"\n        android:theme=\"@android:style/Theme.Material.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n__END_FILE__\nmkdir -p DiegoGonyAntivirus/app/src/main/java/com/diegogony/antivirus\ncat > DiegoGonyAntivirus/app/src/main/java/com/diegogony/antivirus/MainActivity.kt <<'__END_FILE__'\npackage com.diegogony.antivirus\n\nimport android.app.Activity\nimport android.content.Intent\nimport android.content.pm.PackageInfo\nimport android.content.pm.PackageManager\nimport android.graphics.Color\nimport android.graphics.Typeface\nimport android.net.Uri\nimport android.os.Build\nimport android.os.Bundle\nimport android.os.Handler\nimport android.os.Looper\nimport android.provider.Settings\nimport android.widget.Button\nimport android.widget.LinearLayout\nimport android.widget.ProgressBar\nimport android.widget.TextView\nimport java.text.SimpleDateFormat\nimport java.util.Date\nimport java.util.Locale\n\nclass MainActivity : Activity() {\n    private lateinit var timeTv: TextView\n    private lateinit var dateTv: TextView\n    private lateinit var status: TextView\n    private lateinit var radar: RadarView\n    private lateinit var progress: ProgressBar\n    private lateinit var current: TextView\n    private lateinit var statApps: TextView\n    private lateinit var statThreats: TextView\n    private lateinit var statTime: TextView\n    private lateinit var btn: Button\n    private lateinit var results: LinearLayout\n\n    private val ui = Handler(Looper.getMainLooper())\n    private val loc = Locale(\"es\", \"AR\")\n    private val tf = SimpleDateFormat(\"HH:mm:ss\", loc)\n    private val df = SimpleDateFormat(\"EEEE d 'de' MMMM yyyy\", loc)\n    private var scanning = false\n\n    private val clock = object : Runnable {\n        override fun run() {\n            val now = Date()\n            timeTv.text = tf.format(now)\n            dateTv.text = df.format(now).replaceFirstChar { it.uppercase() }\n            ui.postDelayed(this, 1000)\n        }\n    }\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n        window.statusBarColor = Color.parseColor(\"#070D18\")\n        timeTv = findViewById(R.id.clock_time)\n        dateTv = findViewById(R.id.clock_date)\n        status = findViewById(R.id.status)\n        radar = findViewById(R.id.radar)\n        progress = findViewById(R.id.progress)\n        current = findViewById(R.id.current)\n        statApps = findViewById(R.id.stat_apps)\n        statThreats = findViewById(R.id.stat_threats)\n        statTime = findViewById(R.id.stat_time)\n        btn = findViewById(R.id.scan_btn)\n        results = findViewById(R.id.results)\n        btn.setOnClickListener { startScan() }\n    }\n\n    override fun onResume() { super.onResume(); ui.post(clock) }\n    override fun onPause() { super.onPause(); ui.removeCallbacks(clock) }\n\n    private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()\n\n    private fun line(msg: String, color: Int, bold: Boolean = false, onClick: (() -> Unit)? = null) {\n        val tv = TextView(this)\n        tv.text = msg\n        tv.setTextColor(color)\n        tv.textSize = 14f\n        tv.setPadding(0, dp(6), 0, dp(6))\n        if (bold) tv.setTypeface(tv.typeface, Typeface.BOLD)\n        if (onClick != null) tv.setOnClickListener { onClick() }\n        results.addView(tv)\n    }\n\n    @Suppress(\"DEPRECATION\")\n    private fun installed(): List<PackageInfo> =\n        if (Build.VERSION.SDK_INT >= 33)\n            packageManager.getInstalledPackages(PackageManager.PackageInfoFlags.of(PackageManager.GET_PERMISSIONS.toLong()))\n        else packageManager.getInstalledPackages(PackageManager.GET_PERMISSIONS)\n\n    private fun startScan() {\n        if (scanning) return\n        scanning = true\n        btn.isEnabled = false\n        results.removeAllViews()\n        radar.setScanning(true)\n        status.setTextColor(Color.parseColor(\"#38BDF8\"))\n        status.text = \"Analizando…\"\n        statThreats.text = \"Sospechosas\\n0\"\n        Thread {\n            val pm = packageManager\n            val apps = installed().filter { it.packageName != packageName }\n            val acc = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: \"\"\n            val findings = ArrayList<Finding>()\n            val t0 = System.currentTimeMillis()\n            apps.forEachIndexed { i, pi ->\n                val name = pi.applicationInfo?.loadLabel(pm)?.toString() ?: pi.packageName\n                val f = Scanner.analyze(pm, pi, acc)\n                if (f != null) findings.add(f)\n                val secs = (System.currentTimeMillis() - t0) / 1000\n                val n = findings.size\n                ui.post {\n                    current.text = name\n                    progress.progress = (i + 1) * 100 / apps.size\n                    statApps.text = \"Apps\\n${i + 1}\"\n                    statThreats.text = \"Sospechosas\\n$n\"\n                    statTime.text = \"Tiempo\\n%02d:%02d\".format(secs / 60, secs % 60)\n                    radar.addBlip(f != null)\n                }\n                Thread.sleep(30)\n            }\n            val checks = Scanner.deviceChecks(this)\n            ui.post { finish(findings.sortedByDescending { it.level }, checks, apps.size) }\n        }.start()\n    }\n\n    private fun finish(findings: List<Finding>, checks: List<Check>, total: Int) {\n        radar.setScanning(false)\n        scanning = false\n        btn.isEnabled = true\n        btn.text = \"Analizar de nuevo\"\n        current.text = \" \"\n        val red = Color.parseColor(\"#EF4444\")\n        val amber = Color.parseColor(\"#F59E0B\")\n        val green = Color.parseColor(\"#34D399\")\n        val white = Color.parseColor(\"#E6F0FF\")\n        val gray = Color.parseColor(\"#8FA5C6\")\n        if (findings.isEmpty()) {\n            status.setTextColor(green)\n            status.text = \"✓ No se encontraron apps sospechosas\"\n        } else {\n            status.setTextColor(red)\n            status.text = \"⚠ ${findings.size} app(s) sospechosa(s)\"\n        }\n        line(\"Finalizó: \" + SimpleDateFormat(\"dd/MM/yyyy HH:mm:ss\", loc).format(Date()) + \" · $total apps revisadas\", gray)\n        if (findings.isNotEmpty()) {\n            line(\"Apps a revisar (tocá una para abrir sus ajustes y desinstalarla)\", white, true)\n            for (f in findings) {\n                val c = if (f.level == 2) red else amber\n                val tag = if (f.level == 2) \"RIESGO ALTO\" else \"RIESGO MEDIO\"\n                line(\"$tag · ${f.label}\\n\" + f.reasons.joinToString(\"\\n\") { \"• $it\" }, c) {\n                    startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse(\"package:${f.pkg}\")))\n                }\n            }\n        }\n        line(\"Estado del dispositivo\", white, true)\n        for (c in checks) line((if (c.ok) \"✓ \" else \"⚠ \") + c.text, if (c.ok) green else amber)\n        line(\"Este análisis revisa permisos, origen de instalación y ajustes del equipo. No reemplaza a Google Play Protect: mantenelo activado.\", gray)\n    }\n}\n__END_FILE__\nmkdir -p DiegoGonyAntivirus/app/src/main/java/com/diegogony/antivirus\ncat > DiegoGonyAntivirus/app/src/main/java/com/diegogony/antivirus/RadarView.kt <<'__END_FILE__'\npackage com.diegogony.antivirus\n\nimport android.animation.ValueAnimator\nimport android.content.Context\nimport android.graphics.Canvas\nimport android.graphics.Paint\nimport android.graphics.SweepGradient\nimport android.os.SystemClock\nimport android.util.AttributeSet\nimport android.view.View\nimport android.view.animation.LinearInterpolator\nimport kotlin.math.cos\nimport kotlin.math.sin\nimport kotlin.random.Random\n\nclass RadarView(ctx: Context, attrs: AttributeSet?) : View(ctx, attrs) {\n    private class Blip(val x: Float, val y: Float, val bad: Boolean, val born: Long)\n\n    private val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFF06182A.toInt() }\n    private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {\n        style = Paint.Style.STROKE; strokeWidth = 3f; color = 0xFF1F7A8C.toInt()\n    }\n    private val border = Paint(Paint.ANTI_ALIAS_FLAG).apply {\n        style = Paint.Style.STROKE; strokeWidth = 6f; color = 0xFF38BDF8.toInt()\n    }\n    private val sweep = Paint(Paint.ANTI_ALIAS_FLAG)\n    private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { strokeWidth = 5f; color = 0xFF34D399.toInt() }\n    private val blipPaint = Paint(Paint.ANTI_ALIAS_FLAG)\n    private val icon = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }\n\n    private val blips = ArrayList<Blip>()\n    private var angle = 0f\n    private var scanning = false\n    private var animator: ValueAnimator? = null\n\n    fun setScanning(on: Boolean) {\n        scanning = on\n        animator?.cancel()\n        if (on) {\n            animator = ValueAnimator.ofFloat(0f, 360f).apply {\n                duration = 2400\n                repeatCount = ValueAnimator.INFINITE\n                interpolator = LinearInterpolator()\n                addUpdateListener { angle = it.animatedValue as Float; invalidate() }\n                start()\n            }\n        } else invalidate()\n    }\n\n    fun addBlip(bad: Boolean) {\n        val a = Random.nextFloat() * 6.2831f\n        val r = 0.15f + Random.nextFloat() * 0.8f\n        blips.add(Blip(cos(a) * r, sin(a) * r, bad, SystemClock.uptimeMillis()))\n    }\n\n    override fun onMeasure(w: Int, h: Int) {\n        val s = MeasureSpec.getSize(w)\n        setMeasuredDimension(s, s)\n    }\n\n    override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {\n        val c = w / 2f\n        sweep.shader = SweepGradient(\n            c, c,\n            intArrayOf(0x0000FF88, 0x0000FF88, 0xAA00FF88.toInt()),\n            floatArrayOf(0f, 0.7f, 1f)\n        )\n    }\n\n    override fun onDraw(canvas: Canvas) {\n        val c = width / 2f\n        val r = c - 8f\n        canvas.drawCircle(c, c, r, bg)\n        canvas.drawCircle(c, c, r * 2 / 3, ring)\n        canvas.drawCircle(c, c, r / 3, ring)\n        canvas.drawLine(c - r, c, c + r, c, ring)\n        canvas.drawLine(c, c - r, c, c + r, ring)\n        if (scanning) {\n            canvas.save()\n            canvas.rotate(angle, c, c)\n            canvas.drawCircle(c, c, r, sweep)\n            canvas.drawLine(c, c, c + r, c, line)\n            canvas.restore()\n        }\n        val now = SystemClock.uptimeMillis()\n        blips.removeAll { now - it.born > 1800 }\n        for (b in blips) {\n            val alpha = (255 * (1 - (now - b.born) / 1800f)).toInt().coerceIn(0, 255)\n            blipPaint.color = if (b.bad) 0xFFEF4444.toInt() else 0xFF34D399.toInt()\n            blipPaint.alpha = alpha\n            canvas.drawCircle(c + b.x * r, c + b.y * r, if (b.bad) 14f else 7f, blipPaint)\n        }\n        canvas.drawCircle(c, c, r, border)\n        icon.textSize = r / 4\n        canvas.drawText(\"🛡️\", c, c + r / 12, icon)\n        if (blips.isNotEmpty()) postInvalidateOnAnimation()\n    }\n}\n__END_FILE__\nmkdir -p DiegoGonyAntivirus/app/src/main/java/com/diegogony/antivirus\ncat > DiegoGonyAntivirus/app/src/main/java/com/diegogony/antivirus/Scanner.kt <<'__END_FILE__'\npackage com.diegogony.antivirus\n\nimport android.app.KeyguardManager\nimport android.content.Context\nimport android.content.pm.ApplicationInfo\nimport android.content.pm.PackageInfo\nimport android.content.pm.PackageManager\nimport android.os.Build\nimport android.provider.Settings\nimport java.io.File\nimport java.text.SimpleDateFormat\nimport java.util.Locale\n\ndata class Finding(val label: String, val pkg: String, val level: Int, val reasons: List<String>)\ndata class Check(val ok: Boolean, val text: String)\n\nobject Scanner {\n    private val PERMS = mapOf(\n        \"android.permission.SEND_SMS\" to Pair(3, \"Puede enviar SMS\"),\n        \"android.permission.READ_SMS\" to Pair(3, \"Puede leer tus SMS\"),\n        \"android.permission.RECEIVE_SMS\" to Pair(2, \"Intercepta SMS entrantes\"),\n        \"android.permission.READ_CALL_LOG\" to Pair(2, \"Lee tu historial de llamadas\"),\n        \"android.permission.SYSTEM_ALERT_WINDOW\" to Pair(2, \"Se dibuja sobre otras apps\"),\n        \"android.permission.REQUEST_INSTALL_PACKAGES\" to Pair(2, \"Puede instalar otras apps\"),\n        \"android.permission.MANAGE_EXTERNAL_STORAGE\" to Pair(2, \"Acceso total a tus archivos\"),\n        \"android.permission.RECORD_AUDIO\" to Pair(1, \"Usa el micrófono\"),\n        \"android.permission.READ_CONTACTS\" to Pair(1, \"Lee tus contactos\"),\n        \"android.permission.ACCESS_BACKGROUND_LOCATION\" to Pair(1, \"Ubicación en segundo plano\")\n    )\n    private val TRUSTED = setOf(\n        \"com.android.vending\", \"com.sec.android.app.samsungapps\", \"com.amazon.venezia\"\n    )\n\n    @Suppress(\"DEPRECATION\")\n    private fun installer(pm: PackageManager, pkg: String): String? = try {\n        if (Build.VERSION.SDK_INT >= 30) pm.getInstallSourceInfo(pkg).installingPackageName\n        else pm.getInstallerPackageName(pkg)\n    } catch (e: Exception) { null }\n\n    fun analyze(pm: PackageManager, pi: PackageInfo, enabledAcc: String): Finding? {\n        val ai = pi.applicationInfo ?: return null\n        val system = (ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0 &&\n                (ai.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0\n        if (system) return null\n        var score = 0\n        val reasons = ArrayList<String>()\n        pi.requestedPermissions?.forEach { p ->\n            PERMS[p]?.let { score += it.first; reasons.add(it.second) }\n        }\n        if (enabledAcc.contains(pi.packageName)) {\n            score += 3; reasons.add(\"Servicio de accesibilidad activo\")\n        }\n        val inst = installer(pm, pi.packageName)\n        if (inst == null || inst !in TRUSTED) {\n            score += 2; reasons.add(\"Instalada fuera de una tienda oficial\")\n        }\n        val level = when { score >= 9 -> 2; score >= 6 -> 1; else -> 0 }\n        if (level == 0) return null\n        return Finding(ai.loadLabel(pm).toString(), pi.packageName, level, reasons)\n    }\n\n    fun deviceChecks(ctx: Context): List<Check> {\n        val out = ArrayList<Check>()\n        val km = ctx.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager\n        out.add(if (km.isDeviceSecure) Check(true, \"Bloqueo de pantalla activado\")\n        else Check(false, \"Sin bloqueo de pantalla: configurá PIN, patrón o huella\"))\n        val adb = try {\n            Settings.Global.getInt(ctx.contentResolver, Settings.Global.ADB_ENABLED, 0) == 1\n        } catch (e: Exception) { false }\n        out.add(if (adb) Check(false, \"Depuración USB activada (desactivala si no la usás)\")\n        else Check(true, \"Depuración USB desactivada\"))\n        val rooted = listOf(\"/system/bin/su\", \"/system/xbin/su\", \"/sbin/su\", \"/su/bin/su\")\n            .any { File(it).exists() }\n        out.add(if (rooted) Check(false, \"Posible acceso root detectado\")\n        else Check(true, \"Sin señales de root\"))\n        try {\n            val d = SimpleDateFormat(\"yyyy-MM-dd\", Locale.US).parse(Build.VERSION.SECURITY_PATCH)\n            if (d != null) {\n                val days = (System.currentTimeMillis() - d.time) / 86400000L\n                out.add(if (days > 180) Check(false, \"Parche de seguridad antiguo (${Build.VERSION.SECURITY_PATCH}): actualizá el sistema\")\n                else Check(true, \"Parche de seguridad al día (${Build.VERSION.SECURITY_PATCH})\"))\n            }\n        } catch (e: Exception) { }\n        return out\n    }\n}\n__END_FILE__\nmkdir -p DiegoGonyAntivirus/app/src/main/res/drawable\ncat > DiegoGonyAntivirus/app/src/main/res/drawable/btn.xml <<'__END_FILE__'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <solid android:color=\"#22D3EE\" />\n    <corners android:radius=\"16dp\" />\n</shape>\n__END_FILE__\nmkdir -p DiegoGonyAntivirus/app/src/main/res/layout\ncat > DiegoGonyAntivirus/app/src/main/res/layout/activity_main.xml <<'__END_FILE__'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ScrollView xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:layout_width=\"match_parent\" android:layout_height=\"match_parent\"\n    android:background=\"#070D18\" android:fillViewport=\"true\">\n    <LinearLayout\n        android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\"\n        android:orientation=\"vertical\" android:padding=\"20dp\">\n\n        <TextView android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\"\n            android:text=\"🛡️ Diego Goñy Antivirus\" android:textColor=\"#E6F0FF\"\n            android:textSize=\"22sp\" android:textStyle=\"bold\" />\n        <TextView android:id=\"@+id/clock_time\" android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\" android:textColor=\"#38BDF8\"\n            android:textSize=\"28sp\" android:textStyle=\"bold\" android:layout_marginTop=\"6dp\" />\n        <TextView android:id=\"@+id/clock_date\" android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\" android:textColor=\"#8FA5C6\" android:textSize=\"14sp\" />\n\n        <TextView android:id=\"@+id/status\" android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\" android:text=\"Listo para analizar\"\n            android:textColor=\"#34D399\" android:textSize=\"16sp\" android:textStyle=\"bold\"\n            android:layout_marginTop=\"14dp\" android:layout_marginBottom=\"8dp\" />\n\n        <com.diegogony.antivirus.RadarView android:id=\"@+id/radar\"\n            android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" />\n\n        <ProgressBar android:id=\"@+id/progress\" style=\"?android:attr/progressBarStyleHorizontal\"\n            android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\"\n            android:max=\"100\" android:layout_marginTop=\"12dp\" />\n        <TextView android:id=\"@+id/current\" android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\" android:textColor=\"#8FA5C6\"\n            android:textSize=\"12sp\" android:singleLine=\"true\" android:text=\" \" />\n\n        <LinearLayout android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\"\n            android:orientation=\"horizontal\" android:layout_marginTop=\"10dp\" android:weightSum=\"3\">\n            <TextView android:id=\"@+id/stat_apps\" android:layout_width=\"0dp\" android:layout_weight=\"1\"\n                android:layout_height=\"wrap_content\" android:gravity=\"center\" android:text=\"Apps\\n0\"\n                android:textColor=\"#E6F0FF\" android:textSize=\"15sp\" />\n            <TextView android:id=\"@+id/stat_threats\" android:layout_width=\"0dp\" android:layout_weight=\"1\"\n                android:layout_height=\"wrap_content\" android:gravity=\"center\" android:text=\"Sospechosas\\n0\"\n                android:textColor=\"#E6F0FF\" android:textSize=\"15sp\" />\n            <TextView android:id=\"@+id/stat_time\" android:layout_width=\"0dp\" android:layout_weight=\"1\"\n                android:layout_height=\"wrap_content\" android:gravity=\"center\" android:text=\"Tiempo\\n00:00\"\n                android:textColor=\"#E6F0FF\" android:textSize=\"15sp\" />\n        </LinearLayout>\n\n        <Button android:id=\"@+id/scan_btn\" android:layout_width=\"match_parent\"\n            android:layout_height=\"56dp\" android:layout_marginTop=\"16dp\"\n            android:background=\"@drawable/btn\" android:text=\"Iniciar análisis\"\n            android:textColor=\"#04121F\" android:textStyle=\"bold\" android:textSize=\"16sp\" />\n\n        <LinearLayout android:id=\"@+id/results\" android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\" android:orientation=\"vertical\"\n            android:layout_marginTop=\"16dp\" />\n    </LinearLayout>\n</ScrollView>\n__END_FILE__\nmkdir -p DiegoGonyAntivirus\ncat > DiegoGonyAntivirus/build.gradle.kts <<'__END_FILE__'\nplugins {\n    id(\"com.android.application\") version \"8.5.2\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"1.9.24\" apply false\n}\n__END_FILE__\nmkdir -p DiegoGonyAntivirus\ncat > DiegoGonyAntivirus/gradle.properties <<'__END_FILE__'\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n__END_FILE__\nmkdir -p DiegoGonyAntivirus\ncat > DiegoGonyAntivirus/settings.gradle.kts <<'__END_FILE__'\npluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"DiegoGonyAntivirus\"\ninclude(\":app\")\n__END_FILE__\n"},{"name":"Compilar","run":"cd DiegoGonyAntivirus\ngradle assembleDebug --no-daemon\n"},{"uses":"actions/upload-artifact@v4","with":{"name":"DiegoGony-Antivirus-APK","path":"DiegoGonyAntivirus/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
